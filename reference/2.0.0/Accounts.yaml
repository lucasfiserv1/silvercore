            60,620%, TEA 80,507%, TEM 4,974%, TIP 0,166%. Los intereses de
            financiación se calculan desde fecha de vencimiento de su resumen
            anterior. Los intereses punitorios sobre pago mínimo impago se
            calculan desde fecha de vencimiento de su resumen anterior. ** En
            cumplimiento a la normativa BCRA \"A\" 7198, para saldos mayores a $
            200.000,00, la tasa de interés de financiación en pesos a aplicar
            sobre el excedente será: TNA 146,240%, TEA 295,906%, TEM 11,974%.
