            interés de financiación en pesos a aplicar será: TNA 146,240%, TEA
            295,906%, TEM 11,974%. La tasa de interés punitorio en pesos a
            aplicar: será: TNA 73,120%, TIP 0,200% ** ** USTED DISPONE DE 30
            DIAS PARA CUESTIONAR SU RESUMEN DE CUENTA DESDE SU RECEPCION **.
            Descripciones de tasas: TNA: Tasa Nominal Anual, TEA: Tasa Efectiva
            Anual, TEM: Tasa Efectiva Mensual, TIP: Tasa Diaria de Interés
            Punitorio, CFT: Costo Financiero Total
