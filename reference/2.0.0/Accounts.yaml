    ErrorDetailsResponse:
      type: object
      properties:
        dateError:
          type: string
          format: date-time
        message:
          type: string
        detail:
          type: string
    AccountRequestOnlyTitular:
      type: object
      properties:
        accountNumber:
          maxLength: 32
          minLength: 32
          pattern: '[0-9A-F]{32}'
          type: string
          description: >-
            Número de cuenta del tarjetahabiente. Encriptado. La cuenta que se
            encripta debe cumplir con Long 9 dígitos que se completan con ceros
            a la izquierda. EJ: 001234567 / 00#######
          example: W23X24Y25Z26A1B2C3D4E5F6G7H8I9J1
        additional:
          maxLength: 1
          minLength: 1
          type: integer
