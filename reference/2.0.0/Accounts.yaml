        statementFlag:
          maxLength: 1
          type: string
          description: >-
            Exclusivo VisionPLUS.</br>Bandera de Estado de cuenta de la
            Cuenta.</br>Valores:</br></br>En blanco = Declaración normal
            (predeterminado)</br>0 = Código de retención de declaración definido
            por el usuario 10</br>1–9 = Código de retención de declaración
            definido por el usuario 1 a 9</br>I = declaración provisional</br>H
            = Mantener declaración</br>R = Declaración devuelta</br>S =
            Declaración de cierre de sesión</br>O = Estado de cuenta en
            línea/solo archivado</br>U = Suprimir declaración; no generar</br>Z
            = Valor definido por el usuario que suprime la declaración
