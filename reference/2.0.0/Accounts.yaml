            tarjetas de crédito que cuenten con 5 días de atraso considerados
            desde la fecha de vencimiento. Una vez efectuado el pago se
            procederá a su rehabilitación.\" \"De acuerdo a lo estipulado por el
            inc. ñ) de la ley 25.065 se encuentra prohibida la capitalización de
            intereses. \" Informamos que, las bonificaciones y descuentos
            ofrecidos, serán acreditado a los 60 días de efectuada la compra.
