            2016 no estarán afectados por el cobro del mencionado seguro de
            vida. La tasa vigente para adelantos de efectivo en el exterior es
            de TNA 20.00%, CFTNA 24,20% Estimado cliente: Ud. puede abonar en
            cuotas fijas el saldo total de su resumen y sus consumos en contado
            hasta en 24 meses. Abonando previamente su pago mínimo, podrá
            cancelar el saldo a financiar accediendo a los planes de cuotas
            detallados a continuación, teniendo que abonar la primer cuota del
            plan elegido en su próximo resumen de cuenta. Ejemplo de
            cuotificación por un saldo de $1.000: 3 cuotas de $402,31 (TNA: 122
            %, TEA: 214,78%, CFTEA 305,95%, CFTNA 148,48% ) 6 cuotas de $229,79
            (TNA: 122 %, TEA: 214,78%, CFTEA 304,71%, CFTNA 148,15% ) 12 cuotas
            de $146,96 (TNA: 122 %, TEA: 214,78%, CFTEA 303,98%, CFTNA 147,95%)
            24 cuotas de $101,35 (TNA: 122 %, TEA: 214,78%, CFTEA 303,61%,CFTNA
            147,84%) Para acceder a este nuevo beneficio comuníquese al
            0810-666-2378, de lunes a viernes de 9 a 18hs. Recuerde que luego de
            la fecha de vencimiento de su resumen se le cobrarán los intereses
            correspondientes hasta la fecha en la que se le otorgó el préstamo
            en el próximo resumen de cuenta. Sujeto al disponible de la cuenta
            en el momento de la solicitud. ADELANTOS EN EFECTIVO: disponga de
            efectivo en las redes de Cajeros Automáticos Banelco o Link en el
            país. Tasa fija en pesos: TNA 122 %, TEM 10,03 %, TEA 214,78 %,
            CFTEA 308,78%, CFTNA 149,27%. Solicite su PIN llamando al
            (011)4348-7000 para poder operar. De acuerdo a la Comunicación A
            7198 del Banco Central de la República Argentina, la Tasa de interés
            nominal anual sobre saldos excedentes a $200.000 es de CFTEA
            426,49%, CFTNA 177,98% Para saldos menores a $200.000 es de TNA
            122%, CFTEA 302,81%, CFTNA 147,62%. Según la comunicación A 7862 del
            Banco Central de la República Argentina, a partir de los cierres de
            Abril, la tasa de financiación será de TNA 122 % para saldos menores
            a $200.000. De acuerdo a la comunicación A 7559 del Banco Central de
            la República Argentina para los resúmenes que registren consumos en
            moneda extranjera por un importe total superior a USD 200 la Tasa de
            interés aplicable a la totalidad del saldo financiado será la misma
            que resulta aplicable para saldos financiados excedentes de
            $200.000. \"Estimado Cliente, a partir de los cierres de cartera que
            se produzcan el 1 de Junio 2024 las comisiones de tarjetas de
            credito seran las siguientes: Comisión Anual: $ 100.914 para la
            Tarjeta Mastercard Regional / $114.103 para la Tarjeta Mastercard
            Internacional/ $251.438 para la Tarjeta Mastercard Gold /$ 350.053
            para la Tarjeta Mastercard Platinum/ $ 434.269 para la Tarjeta
            Mastercard Black.-(incluye IVA). Comisión de Mantenimiento*: para
            todas las tarjetas de crédito Black, Platinum, Gold, Internacional y
            Regional la comisión de Mantenimiento será de $6.292.- (incluye
            IVA). Comisión por Reposicion: para todas las tarjetas de crédito
            Black, Platinum, Gold, Internacional y Regional la comisión de
            reposicion por robo, extravio y/o hurto será de $15.488.- (incluye
            IVA). *Los precios indicados no aplican a las Tarjetas de Crédito
            que, por encontrarse dentro de un paquete vigente o por contar con
            convenio especial de cobranding o convenio especial por acreditacion
            de haberes, se encuentran bonificadas. Podrás optar por rescindir el
            contrato en cualquier momento antes de la entrada en vigencia del
            cambio y sin cargo alguno, sin perjuicio de que deberá cumplir con
            las obligaciones pendientes a su cargo. Usted puede consultar el
            Régimen de Transparencia elaborado por el Banco Central de la
            República Argentina sobre la base de la información proporcionada
            por los sujetos obligados a fin de comparar los costos,
            características y requisitos de los productos y servicios
            financieros Ingresando a:
            http://www.bcra.gob.ar/BCRAyVos/Regimen_de_transparencia.asp Para
            más información consulta las condiciones en www.bbva.com.ar, o bien
            podes comunicarte con Línea BBVA al 0800-333-0303 de lunes a viernes
            de 7:30 a 21 hs. o acercarte a cualquiera de nuestras sucursales.
            Estimados clientes, les recordamos que, de acuerdo a lo normado por
            el B.C.R.A, las personas no residentes no pueden acceder al mercado
            de cambios y tampoco pueden realizar consumos en el exterior y/o en
            moneda extranjera con sus trajetas de crédito. En el presente cierre
