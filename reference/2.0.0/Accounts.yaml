            consumos en 1 a 3 pagos y débitos automáticos cuotas 7ma a 12va
            comisiones, intereses, seguro de vida, adelantos en efectivo,
            excesos en el LC, pagos mínimos impagos anteriores e impuestos. A la
            sumatoria de los conceptos detallados se le restan los reintegros
            comprendidos en este resumen para la conformación final del monto
